name: Keep-alive

# Keeps the free Render service awake for judges (it sleeps after ~15 idle minutes). Free on a public repo.
# GitHub can delay scheduled runs; an UptimeRobot 5-minute monitor on /api/health is the belt to this braces.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          URL: ${{ vars.KEEPALIVE_URL || 'https://shugaba-demo.onrender.com/api/health' }}
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "$URL"
