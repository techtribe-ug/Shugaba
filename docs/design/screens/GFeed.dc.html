<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circle feed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Jost:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0070E0}a:hover{color:#003087}
.num{font-variant-numeric:tabular-nums;font-family:'Jost','Plus Jakarta Sans',sans-serif}



/* motion pass */
@property --m-n{syntax:'<integer>';initial-value:0;inherits:false}
@view-transition{navigation:auto}
::view-transition-old(root){animation:m-out .18s ease-in both}
::view-transition-new(root){animation:m-in .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes m-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes m-out{to{opacity:0;transform:translateY(-4px)}}
@keyframes m-breathe{0%,100%{scale:1 1}50%{scale:1.025 .985}}
@keyframes m-look{0%,38%,100%{translate:0 0}42%,58%{translate:2px -.5px}62%,78%{translate:-1.5px 0}}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes m-count{from{--m-n:0}to{--m-n:var(--to)}}
:where(.m-root > :not(main)), :where(.m-root main > *){animation:m-in .5s cubic-bezier(.2,.8,.2,1) both}
.m-root main > :nth-child(2){animation-delay:.05s}.m-root main > :nth-child(3){animation-delay:.1s}
.m-root main > :nth-child(4){animation-delay:.15s}.m-root main > :nth-child(5){animation-delay:.2s}
.m-root main > :nth-child(6){animation-delay:.25s}.m-root main > :nth-child(n+7){animation-delay:.3s}
:where(svg[viewBox="-50 -50 100 100"]){animation-name:m-breathe;animation-duration:4.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-origin:50% 85%}
svg[viewBox="-50 -50 100 100"] > circle[fill="#FFFFFF"]{animation:m-blink 5.2s infinite, m-look 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.m-count{counter-reset:m var(--m-n)}.m-count::after{content:counter(m)}
.m-count{animation:m-count 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
.m-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{transition:transform .14s ease, background-color .2s ease, color .2s ease, opacity .2s ease}
button:active{transform:scale(.97)}
a{transition:color .2s ease, opacity .2s ease}
:where(.m-root [style*="width:"][style*="%"]){transition:width .6s cubic-bezier(.2,.8,.2,1)}
:where(.m-root label *, .m-root [role="switch"] *){transition:transform .22s cubic-bezier(.2,.8,.2,1), background-color .22s ease, opacity .22s ease}
@keyframes m-react{0%{opacity:0;translate:0 1.5px}4%,16%{opacity:1;translate:0 0}20%,100%{opacity:0;translate:0 1px}}
.m-r{opacity:0;animation:m-react var(--cy,16s) ease-in-out var(--dl,2s) infinite}
@media (prefers-reduced-motion: reduce){.m-root,.m-root *,.m-root *::after{animation:none!important;transition:none!important}::view-transition-old(root),::view-transition-new(root){animation:none}.m-count{counter-reset:m var(--to)}}
/* end motion pass */
</style>
</helmet>
<div class="m-root" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #18181B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 8px; padding: 16px 16px 0 12px">
    <a href="GHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18181B">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-size: 20px; font-weight: 800">Circle feed</span>
      <span style="font-size: 13px; color: #71717A">All 6 members see this</span>
    </div>
  </header>

  <main style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 18px; padding: 16px 20px 28px 20px; overflow: hidden">
    <sc-for list="{{posts}}" as="p" hint-placeholder-count="5">
      <div style="display: flex; gap: 14px; align-items: flex-start">
        <span style="width: 12px; height: 12px; margin-top: 7px; flex: none; border-radius: 999px; background: {{p.dot}}"></span>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 18px; font-weight: 600; line-height: 1.4">{{p.text}}</span>
          <span class="num" style="font-size: 12px; color: #71717A">{{p.time}} · <a href="GLedger.dc.html">#{{p.seq}}</a></span>
        </div>
      </div>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 10px; padding-top: 8px; border-top: 1px solid #EEEEF0">
      <svg style="overflow: visible" aria-hidden="true" width="28" height="28" viewBox="-50 -50 100 100"><path d="M-27 -6 C-27 -26 -4 -31 10 -27 C27 -23 31 -6 28 9 C25 25 6 31 -8 29 C-23 27 -27 13 -27 -6 Z" fill="#3B358A"></path><circle cx="-7" cy="-3" r="3.7" fill="#FFFFFF"></circle><circle cx="11" cy="-3" r="3.7" fill="#FFFFFF"></circle><g class="m-r" style="--cy: 16s; --dl: 1.6s"><circle cx="-7.0" cy="-3.0" r="7.0" fill="none" stroke="#FFFFFF" stroke-width="2.8"></circle><circle cx="11.0" cy="-3.0" r="7.0" fill="none" stroke="#FFFFFF" stroke-width="2.8"></circle><path d="M0.0 -4.0 Q2.0 -7.0 4.0 -4.0" fill="none" stroke="#FFFFFF" stroke-width="2.8"></path></g></svg>
      <span style="font-size: 13px; color: #71717A">Only Shugaba posts here. Every line links to the ledger.</span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  var p = [
    ['09:10', '0140', '5 of 6 paid for round 2.', '#D4D4D8'],
    ['09:11', '0138', "Musa's payment didn't go through. He has until Thursday.", '#C62828'],
    ['14:01', '0144', "The pool covered Musa's $50.", '#0070E0'],
    ['14:02', '0146', '✓ Payout sent · $300 · Ngozi', '#16A34A'],
    ['15:30', '0152', 'Tunde and Ifeoma swapped turns 3 and 5.', '#18181B']
  ];
  return { posts: p.map(function (r) { return { time: r[0], seq: r[1], text: r[2], dot: r[3] }; }) };
}
}
</script>
</body>
</html>
