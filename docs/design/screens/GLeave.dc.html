<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Leave a circle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Jost:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.num{font-variant-numeric:tabular-nums;font-family:'Jost','Plus Jakarta Sans',sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #0070E0;outline-offset:2px}



/* motion pass */
@property --m-n{syntax:'<integer>';initial-value:0;inherits:false}
@view-transition{navigation:auto}
::view-transition-old(root){animation:m-out .18s ease-in both}
::view-transition-new(root){animation:m-in .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes m-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes m-out{to{opacity:0;transform:translateY(-4px)}}
@keyframes m-breathe{0%,100%{scale:1 1}50%{scale:1.025 .985}}
@keyframes m-look{0%,38%,100%{translate:0 0}42%,58%{translate:2px -.5px}62%,78%{translate:-1.5px 0}}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes m-count{from{--m-n:0}to{--m-n:var(--to)}}
:where(.m-root > :not(main)), :where(.m-root main > *){animation:m-in .5s cubic-bezier(.2,.8,.2,1) both}
.m-root main > :nth-child(2){animation-delay:.05s}.m-root main > :nth-child(3){animation-delay:.1s}
.m-root main > :nth-child(4){animation-delay:.15s}.m-root main > :nth-child(5){animation-delay:.2s}
.m-root main > :nth-child(6){animation-delay:.25s}.m-root main > :nth-child(n+7){animation-delay:.3s}
:where(svg[viewBox="-50 -50 100 100"]){animation-name:m-breathe;animation-duration:4.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-origin:50% 85%}
svg[viewBox="-50 -50 100 100"] > circle[fill="#FFFFFF"]{animation:m-blink 5.2s infinite, m-look 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.m-count{counter-reset:m var(--m-n)}.m-count::after{content:counter(m)}
.m-count{animation:m-count 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
.m-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{transition:transform .14s ease, background-color .2s ease, color .2s ease, opacity .2s ease}
button:active{transform:scale(.97)}
a{transition:color .2s ease, opacity .2s ease}
:where(.m-root [style*="width:"][style*="%"]){transition:width .6s cubic-bezier(.2,.8,.2,1)}
:where(.m-root label *, .m-root [role="switch"] *){transition:transform .22s cubic-bezier(.2,.8,.2,1), background-color .22s ease, opacity .22s ease}
@keyframes m-react{0%{opacity:0;translate:0 1.5px}4%,16%{opacity:1;translate:0 0}20%,100%{opacity:0;translate:0 1px}}
.m-r{opacity:0;animation:m-react var(--cy,16s) ease-in-out var(--dl,2s) infinite}
@media (prefers-reduced-motion: reduce){.m-root,.m-root *,.m-root *::after{animation:none!important;transition:none!important}::view-transition-old(root),::view-transition-new(root){animation:none}.m-count{counter-reset:m var(--to)}}
/* end motion pass */
</style>
</helmet>
<div class="m-root" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #18181B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 14px 24px 28px 24px">

  <header style="display: flex; align-items: center; justify-content: space-between; margin-left: -12px">
    <a href="GHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18181B">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div role="group" aria-label="Preview as" style="display: flex; gap: 16px">
      <sc-for list="{{who}}" as="w" hint-placeholder-count="2">
        <button onClick="{{w.go}}" aria-pressed="{{w.on}}" style="height: 36px; padding: 0; border: 0; background: transparent; font-size: 13px; font-weight: 700; color: {{w.fg}}">{{w.name}}</button>
      </sc-for>
    </div>
  </header>

  <svg role="img" aria-label="Shugaba, concerned" width="56" height="56" viewBox="-50 -50 100 100" style="margin-top: 36px; overflow: visible"><path d="M-27 -6 C-27 -26 -4 -31 10 -27 C27 -23 31 -6 28 9 C25 25 6 31 -8 29 C-23 27 -27 13 -27 -6 Z" fill="#3B358A"></path><circle cx="-7" cy="0" r="4" fill="#FFFFFF"></circle><circle cx="11" cy="0" r="4" fill="#FFFFFF"></circle><g class="m-r" style="--cy: 14s; --dl: 1.6s"><rect x="-13.6" y="-5.6" width="13.2" height="5.5" fill="#3B358A"></rect><rect x="4.4" y="-5.6" width="13.2" height="5.5" fill="#3B358A"></rect><path d="M-11.6 -0.1 L-2.4 -0.1" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.0" stroke-linecap="round"></path><path d="M6.4 -0.1 L15.6 -0.1" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.0" stroke-linecap="round"></path></g></svg>
  <h1 class="num" style="margin: 22px 0 0 0; font-size: 34px; font-weight: 700; letter-spacing: -0.8px; line-height: 1.1">Leave Family Circle?</h1>
  <p style="margin: 10px 0 0 0; font-size: 16px; color: #71717A; line-height: 1.45">{{lead}}</p>

  <section aria-label="What happens" style="margin-top: 32px; display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 15px 0; border-top: 1px solid #F4F4F5">
        <span style="font-size: 15px; color: #52525B">{{r.k}}</span>
        <span class="num" style="font-size: 18px; font-weight: 700; color: {{r.fg}}; text-align: right">{{r.v}}</span>
      </div>
    </sc-for>
  </section>

  <p style="margin: 18px 0 0 0; display: flex; gap: 8px; font-size: 13px; color: #71717A; line-height: 1.45">
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"></path></svg>{{note}}</p>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 6px">
    <a href="GHome.dc.html" style="text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 5px; height: 56px; border: 0; border-radius: 14px; background: #18181B; color: #FFFFFF; font-size: 16px; font-weight: 800">Stay in the circle</a>
    <button style="height: 52px; border: 0; background: transparent; color: #C62828; font-size: 15px; font-weight: 700">{{leaveLabel}}</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  var self = this, w = (this.state && this.state.w) || 0;
  var C = [
    { name: 'Tunde · not paid out yet', lead: 'You haven’t been paid out yet, so your money comes back. Sooner if someone takes your seat.',
      rows: [['Paid in so far', '$102', '#18181B'], ['Protection fee, kept', '−$2', '#71717A'], ['PayPal fees, kept', '−$3.60', '#71717A'], ['Comes back to you', '$96.40', '#16A34A'], ['When', '26 Nov', '#18181B']],
      note: 'Leave by 12 Nov and your Circle Score doesn’t change.', leave: 'Leave and get $96.40 back' },
    { name: 'Amina · already paid out', lead: 'You got $300 on 29 Oct. The others are still paying you back, so you still owe your share.',
      rows: [['Still to pay', '$200', '#B26A00'], ['Or keep paying', '$50 a turn', '#18181B'], ['Circle Score', 'Safe if paid', '#18181B']],
      note: 'If payments stop, the pool covers the group and you get an invoice. Unpaid: score −60.', leave: 'Pay $200 and leave' }
  ];
  var c = C[w];
  return {
    lead: c.lead, note: c.note, leaveLabel: c.leave,
    rows: c.rows.map(function (r) { return { k: r[0], v: r[1], fg: r[2] }; }),
    who: C.map(function (x, i) { return { name: x.name.split(' · ')[0], on: i === w ? 'true' : 'false', fg: i === w ? '#18181B' : '#A1A1AA', go: function () { self.setState({ w: i }); } }; })
  };
}
}
</script>
</body>
</html>
