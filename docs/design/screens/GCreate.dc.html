<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New circle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Jost:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0070E0}a:hover{color:#003087}
.num{font-variant-numeric:tabular-nums;font-family:'Jost','Plus Jakarta Sans',sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #0070E0;outline-offset:2px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.eye{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes hop{0%,100%{transform:none}35%{transform:translateY(-14px)}60%{transform:translateY(0)}75%{transform:translateY(-5px)}}
.hop{animation:hop 1.1s ease-out .3s 2}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s ease-out both}
@keyframes fall{0%{transform:translateY(-40px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(260px) rotate(200deg);opacity:0}}
.fall{animation:fall 2.6s ease-in infinite}
@media (prefers-reduced-motion: reduce){.eye,.hop,.rise,.fall{animation:none}}




/* motion pass */
@property --m-n{syntax:'<integer>';initial-value:0;inherits:false}
@view-transition{navigation:auto}
::view-transition-old(root){animation:m-out .18s ease-in both}
::view-transition-new(root){animation:m-in .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes m-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes m-out{to{opacity:0;transform:translateY(-4px)}}
@keyframes m-breathe{0%,100%{scale:1 1}50%{scale:1.025 .985}}
@keyframes m-look{0%,38%,100%{translate:0 0}42%,58%{translate:2px -.5px}62%,78%{translate:-1.5px 0}}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes m-count{from{--m-n:0}to{--m-n:var(--to)}}
:where(.m-root > :not(main)), :where(.m-root main > *){animation:m-in .5s cubic-bezier(.2,.8,.2,1) both}
.m-root main > :nth-child(2){animation-delay:.05s}.m-root main > :nth-child(3){animation-delay:.1s}
.m-root main > :nth-child(4){animation-delay:.15s}.m-root main > :nth-child(5){animation-delay:.2s}
.m-root main > :nth-child(6){animation-delay:.25s}.m-root main > :nth-child(n+7){animation-delay:.3s}
:where(svg[viewBox="-50 -50 100 100"]){animation-name:m-breathe;animation-duration:4.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-origin:50% 85%}
svg[viewBox="-50 -50 100 100"] > circle[fill="#FFFFFF"]{animation:m-blink 5.2s infinite, m-look 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.m-count{counter-reset:m var(--m-n)}.m-count::after{content:counter(m)}
.m-count{animation:m-count 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
.m-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{transition:transform .14s ease, background-color .2s ease, color .2s ease, opacity .2s ease}
button:active{transform:scale(.97)}
a{transition:color .2s ease, opacity .2s ease}
:where(.m-root [style*="width:"][style*="%"]){transition:width .6s cubic-bezier(.2,.8,.2,1)}
:where(.m-root label *, .m-root [role="switch"] *){transition:transform .22s cubic-bezier(.2,.8,.2,1), background-color .22s ease, opacity .22s ease}
@keyframes m-react{0%{opacity:0;translate:0 1.5px}4%,16%{opacity:1;translate:0 0}20%,100%{opacity:0;translate:0 1px}}
.m-r{opacity:0;animation:m-react var(--cy,16s) ease-in-out var(--dl,2s) infinite}
@media (prefers-reduced-motion: reduce){.m-root,.m-root *,.m-root *::after{animation:none!important;transition:none!important}::view-transition-old(root),::view-transition-new(root){animation:none}.m-count{counter-reset:m var(--to)}}
/* end motion pass */
</style>
</helmet>
<div class="m-root" style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #18181B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<header style="display: flex; align-items: center; gap: 6px; padding: 14px 16px 0 8px; min-height: 48px"><a href="GHome.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #18181B"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M15 18l-6-6 6-6"></path></svg></a><span style="font-size: 16px; font-weight: 800">New circle</span><span style="flex: 1"></span></header>
<main style="flex: 1; display: flex; flex-direction: column; padding: 18px 24px 28px 24px; gap: 26px">
  <section aria-label="Amount" style="display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 13px; font-weight: 700; color: #A1A1AA">Each person puts in</span>
    <div style="display: flex; align-items: center; gap: 14px">
      <button onClick="{{less}}" aria-label="Less" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #F4F4F5; font-size: 22px; font-weight: 700; color: #18181B">−</button>
      <span class="num" aria-live="polite" style="flex: 1; text-align: center; font-size: 64px; font-weight: 700; letter-spacing: -2px; line-height: 1">{{amount}}</span>
      <button onClick="{{more}}" aria-label="More" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #F4F4F5; font-size: 22px; font-weight: 700; color: #18181B">+</button>
    </div>
  </section>
  <section aria-label="People and how often" style="display: flex; flex-direction: column">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-top: 1px solid #F4F4F5"><span style="font-size: 15px; color: #52525B">People</span>
      <span style="display: flex; gap: 18px"><sc-for list="{{sizes}}" as="z" hint-placeholder-count="4"><button onClick="{{z.go}}" aria-pressed="{{z.on}}" class="num" style="height: 32px; padding: 0; border: 0; border-bottom: 2px solid {{z.bar}}; background: transparent; font-size: 17px; font-weight: 700; color: {{z.fg}}">{{z.n}}</button></sc-for></span></div>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-top: 1px solid #F4F4F5; border-bottom: 1px solid #F4F4F5"><span style="font-size: 15px; color: #52525B">How often</span>
      <span style="display: flex; gap: 18px"><sc-for list="{{freqs}}" as="q" hint-placeholder-count="3"><button onClick="{{q.go}}" aria-pressed="{{q.on}}" style="height: 32px; padding: 0; border: 0; border-bottom: 2px solid {{q.bar}}; background: transparent; font-size: 15px; font-weight: 700; color: {{q.fg}}">{{q.n}}</button></sc-for></span></div>
  </section>
  <section aria-label="Protection" style="display: flex; flex-direction: column">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: #A1A1AA; padding-bottom: 6px"><span aria-hidden="true" style=" width: 18px; height: 18px; flex: none; border-radius: 999px; background: #0070E0; display: flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"></path></svg></span>Protection</span>
    <sc-for list="{{tiers}}" as="t" hint-placeholder-count="3">
      <button onClick="{{t.go}}" aria-pressed="{{t.on}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border: 0; border-top: 1px solid #F4F4F5; background: transparent; text-align: left; color: #18181B">
        <span style="width: 22px; height: 22px; flex: none; border-radius: 999px; box-sizing: border-box; border: {{t.ring}}; background: {{t.dot}}; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 700">{{t.name}}</span><span style="font-size: 13px; color: #71717A">{{t.covers}}</span></span>
        <span class="num" style="font-size: 15px; font-weight: 700">{{t.fee}}</span>
      </button>
    </sc-for>
  </section>
  <div style="margin-top: auto; display: flex; gap: 10px; align-items: flex-start"><svg class="" aria-hidden="true" width="26" height="26" viewBox="-50 -50 100 100" style="flex: none; overflow: visible"><path d="M-27 -6 C-27 -26 -4 -31 10 -27 C27 -23 31 -6 28 9 C25 25 6 31 -8 29 C-23 27 -27 13 -27 -6 Z" fill="#3B358A"></path><circle class="eye" cx="-7" cy="-3" r="4" fill="#FFFFFF"></circle><circle class="eye" cx="11" cy="-3" r="4" fill="#FFFFFF"></circle><g class="m-r" style="--cy: 16s; --dl: 1.6s"><path d="M17.5 -5.2 l3 -2 M18.0 -1.9 l3.4 0 M17.5 1.3 l3 2 M-13.5 -5.2 l-3 -2 M-14.0 -1.9 l-3.4 0 M-13.5 1.3 l-3 2" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="2.0" stroke-linecap="round"></path><path d="M-3.0 12.1 Q2.0 16.5 7.0 12.1" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round"></path></g></svg><p aria-live="polite" style="margin: 2px 0 0 0; font-size: 15px; line-height: 1.45">{{summary}}</p></div>
  <a href="GHome.dc.html" style="text-decoration: none; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 5px; height: 56px; border: 0; border-radius: 14px; background: #18181B; color: #FFFFFF; font-size: 16px; font-weight: 800">Create circle</a>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
  var self = this, st = this.state || {};
  var amt = st.amt || 50, size = st.size || 6, fq = st.fq === undefined ? 0 : st.fq, tier = st.tier === undefined ? 1 : st.tier;
  function set(o) { return function () { self.setState(o); }; }
  var F = ['week', 'fortnight', 'month'], T = [['Basic', 'Covers 1 missed payment', 100], ['Standard', 'Covers 2 missed payments', 200], ['Plus', 'Covers 3 missed payments', 300]];
  var fee = Math.floor(amt * T[tier][2] / 100) / 100;
  var fmt = function (n) { return '$' + (n % 1 ? n.toFixed(2) : n); };
  return {
    amount: '$' + amt,
    less: set({ amt: Math.max(10, amt - 10) }), more: set({ amt: Math.min(500, amt + 10) }),
    sizes: [4, 6, 8, 10].map(function (n) { var on = n === size; return { n: n, on: on ? 'true' : 'false', fg: on ? '#18181B' : '#A1A1AA', bar: on ? '#18181B' : 'transparent', go: set({ size: n }) }; }),
    freqs: ['Weekly', 'Fortnightly', 'Monthly'].map(function (n, i) { var on = i === fq; return { n: n, on: on ? 'true' : 'false', fg: on ? '#18181B' : '#A1A1AA', bar: on ? '#18181B' : 'transparent', go: set({ fq: i }) }; }),
    tiers: T.map(function (t, i) { var on = i === tier; return { name: t[0], covers: t[1], fee: fmt(Math.floor(amt * t[2] / 100) / 100) + ' each', on: on ? 'true' : 'false', ring: on ? '0' : '1.5px solid #D4D4D8', dot: on ? '#18181B' : '#FFFFFF', go: set({ tier: i }) }; }),
    summary: 'Each person pays ' + fmt(amt + fee) + ' a ' + F[fq] + '. One person gets ' + fmt(amt * size) + ' each ' + F[fq] + ', ' + size + ' turns in all.'
  };
}
}
</script>
</body>
</html>
