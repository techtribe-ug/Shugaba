<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Judge panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Jost:wght@500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0070E0}a:hover{color:#003087}
.num{font-variant-numeric:tabular-nums;font-family:'Jost','Plus Jakarta Sans',sans-serif}
.big{font-family:'Jost','Plus Jakarta Sans',sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #0070E0;outline-offset:2px}
.step:hover{color:#18181B}



/* motion pass */
@property --m-n{syntax:'<integer>';initial-value:0;inherits:false}
@view-transition{navigation:auto}
::view-transition-old(root){animation:m-out .18s ease-in both}
::view-transition-new(root){animation:m-in .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes m-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes m-out{to{opacity:0;transform:translateY(-4px)}}
@keyframes m-breathe{0%,100%{scale:1 1}50%{scale:1.025 .985}}
@keyframes m-look{0%,38%,100%{translate:0 0}42%,58%{translate:2px -.5px}62%,78%{translate:-1.5px 0}}
@keyframes m-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes m-count{from{--m-n:0}to{--m-n:var(--to)}}
:where(.m-root > :not(main)), :where(.m-root main > *){animation:m-in .5s cubic-bezier(.2,.8,.2,1) both}
.m-root main > :nth-child(2){animation-delay:.05s}.m-root main > :nth-child(3){animation-delay:.1s}
.m-root main > :nth-child(4){animation-delay:.15s}.m-root main > :nth-child(5){animation-delay:.2s}
.m-root main > :nth-child(6){animation-delay:.25s}.m-root main > :nth-child(n+7){animation-delay:.3s}
:where(svg[viewBox="-50 -50 100 100"]){animation-name:m-breathe;animation-duration:4.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out;transform-origin:50% 85%}
svg[viewBox="-50 -50 100 100"] > circle[fill="#FFFFFF"]{animation:m-blink 5.2s infinite, m-look 9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.m-count{counter-reset:m var(--m-n)}.m-count::after{content:counter(m)}
.m-count{animation:m-count 1.1s cubic-bezier(.2,.8,.2,1) .15s both}
.m-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button{transition:transform .14s ease, background-color .2s ease, color .2s ease, opacity .2s ease}
button:active{transform:scale(.97)}
a{transition:color .2s ease, opacity .2s ease}
:where(.m-root [style*="width:"][style*="%"]){transition:width .6s cubic-bezier(.2,.8,.2,1)}
:where(.m-root label *, .m-root [role="switch"] *){transition:transform .22s cubic-bezier(.2,.8,.2,1), background-color .22s ease, opacity .22s ease}
@keyframes m-react{0%{opacity:0;translate:0 1.5px}4%,16%{opacity:1;translate:0 0}20%,100%{opacity:0;translate:0 1px}}
.m-r{opacity:0;animation:m-react var(--cy,16s) ease-in-out var(--dl,2s) infinite}
@media (prefers-reduced-motion: reduce){.m-root,.m-root *,.m-root *::after{animation:none!important;transition:none!important}::view-transition-old(root),::view-transition-new(root){animation:none}.m-count{counter-reset:m var(--to)}}
/* end motion pass */
</style>
</helmet>
<div class="m-root" style="min-height: 760px; box-sizing: border-box; background: #FFFFFF; color: #18181B; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 40px 56px">
<div style="max-width: 1160px; margin: 0 auto"><div style="display: flex; align-items: center; gap: 10px; padding-bottom: 28px"><a href="GHome.dc.html" aria-label="Shugaba home" style="display: flex; align-items: center; gap: 9px; text-decoration: none; color: #18181B"><svg aria-hidden="true" width="26" height="26" viewBox="-50 -50 100 100" style="flex: none"><path d="M-27 -6 C-27 -26 -4 -31 10 -27 C27 -23 31 -6 28 9 C25 25 6 31 -8 29 C-23 27 -27 13 -27 -6 Z" fill="#3B358A"></path><circle cx="-7" cy="-3" r="3.9" fill="#FFFFFF"></circle><circle cx="11" cy="-3" r="3.9" fill="#FFFFFF"></circle></svg><span style="font-family: Jost, sans-serif; font-size: 20px; font-weight: 700; letter-spacing: -0.5px; line-height: 1">shugaba</span></a><span aria-hidden="true" style="width: 1px; height: 18px; background: #E4E4E7; margin: 0 6px"></span><span style="font-size: 14px; font-weight: 700; color: #71717A">Judge demo</span></div></div>
<div style="max-width: 1160px; margin: 0 auto; display: flex; gap: 72px; flex-wrap: wrap">

  <nav aria-label="Demo steps" style="flex: 0 0 180px; display: flex; flex-direction: column">
    <span style="font-size: 13px; font-weight: 700; color: #A1A1AA; padding-bottom: 16px">Demo</span>
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="11">
      <button class="step" onClick="{{s.go}}" aria-current="{{s.current}}" style="display: flex; align-items: baseline; gap: 12px; min-height: 36px; padding: 0 0 0 14px; border: 0; border-left: 2px solid {{s.bar}}; background: transparent; color: {{s.fg}}; font-size: 14px; font-weight: {{s.weight}}; text-align: left">
        <span class="num" style="width: 16px; font-size: 13px; color: #A1A1AA">{{s.n}}</span>{{s.name}}
      </button>
    </sc-for>
  </nav>

  <main style="flex: 1 1 520px; display: flex; flex-direction: column; padding-top: 28px">
    <svg style="overflow: visible" role="img" aria-label="Shugaba, {{cur.moodName}}" width="72" height="72" viewBox="-50 -50 100 100">
      <path d="M-27 -6 C-27 -26 -4 -31 10 -27 C27 -23 31 -6 28 9 C25 25 6 31 -8 29 C-23 27 -27 13 -27 -6 Z" transform="scale(1.32)" fill="none" stroke="{{cur.halo}}" stroke-width="2.4" vector-effect="non-scaling-stroke"></path>
      <path d="M-27 -6 C-27 -26 -4 -31 10 -27 C27 -23 31 -6 28 9 C25 25 6 31 -8 29 C-23 27 -27 13 -27 -6 Z" fill="#3B358A"></path>
      <sc-if value="{{cur.roundEyes}}" hint-placeholder-val="{{ true }}">
        <circle cx="-7" cy="{{cur.eyeY}}" r="3.7" fill="#FFFFFF"></circle><circle cx="11" cy="{{cur.eyeY}}" r="3.7" fill="#FFFFFF"></circle>
      </sc-if>
      <sc-if value="{{cur.flatEyes}}" hint-placeholder-val="{{ false }}">
        <rect x="-11.5" y="-4.5" width="9" height="3" rx="1.5" fill="#FFFFFF"></rect><rect x="6.5" y="-4.5" width="9" height="3" rx="1.5" fill="#FFFFFF"></rect>
      </sc-if>
    </svg>

    <h1 class="big" aria-live="polite" style="margin: 36px 0 0 0; font-size: 56px; font-weight: 700; line-height: 1.05; letter-spacing: -1.5px; max-width: 620px">{{cur.head}}</h1>
    <p style="margin: 16px 0 0 0; font-size: 20px; color: #71717A; max-width: 560px">{{cur.sub}}</p>

    <sc-if value="{{cur.hasProof}}" hint-placeholder-val="{{ true }}">
      <a href="GVerify.dc.html" style="margin-top: 28px; align-self: flex-start; text-decoration: none; display: flex; align-items: baseline; gap: 14px; color: #18181B">
        <span class="num" style="font-size: 20px; font-weight: 700">{{cur.amount}}</span>
        <span style="font-size: 15px; color: #71717A">{{cur.what}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #0070E0">{{cur.hash}} ↗</span>
      </a>
    </sc-if>

    <div style="margin-top: auto; padding-top: 48px; display: flex; align-items: center; gap: 28px">
      <button onClick="{{next}}" style="height: 56px; padding: 0 32px; border: 0; border-radius: 14px; background: #18181B; color: #FFFFFF; font-size: 16px; font-weight: 800">{{cur.nextLabel}}</button>
      <button onClick="{{back}}" style="height: 56px; padding: 0; border: 0; background: transparent; color: #71717A; font-size: 15px; font-weight: 700">Back</button>
      <span style="flex: 1"></span>
      <button onClick="{{reset}}" style="height: 56px; padding: 0; border: 0; background: transparent; color: #A1A1AA; font-size: 14px; font-weight: 700">Start over</button>
    </div>
  </main>

  <aside style="flex: 0 0 200px; display: flex; flex-direction: column; gap: 40px; padding-top: 34px">
    <section aria-label="Open as a member" style="display: flex; flex-direction: column; gap: 14px">
      <span style="font-size: 13px; font-weight: 700; color: #A1A1AA">See it as</span>
      <div style="display: grid; grid-template-columns: repeat(3, 48px); gap: 14px 16px">
        <sc-for list="{{members}}" as="m" hint-placeholder-count="6">
          <a href="GHome.dc.html" target="_blank" title="{{m.name}}" aria-label="Open as {{m.name}} in a new tab" style="width: 48px; height: 48px; border-radius: 999px; overflow: hidden; display: block; background: {{m.bg}}">
            <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 64 64"><circle cx="32" cy="25" r="11" fill="{{m.fg}}"></circle><path d="M12 56c3-11 11-17 20-17s17 6 20 17a32 32 0 0 1-40 0Z" fill="{{m.fg}}"></path></svg>
          </a>
        </sc-for>
      </div>
    </section>

    <section aria-label="Jump to a moment" style="display: flex; flex-direction: column">
      <span style="font-size: 13px; font-weight: 700; color: #A1A1AA; padding-bottom: 6px">Jump to</span>
      <sc-for list="{{shortcuts}}" as="k" hint-placeholder-count="3">
        <button onClick="{{k.go}}" style="min-height: 44px; padding: 0; border: 0; border-bottom: 1px solid #F4F4F5; background: transparent; color: #18181B; font-size: 14px; font-weight: 700; text-align: left">{{k.label}}</button>
      </sc-for>
      <a href="GOps.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none">Control tower ↗</a>
    </section>
  </aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
renderVals() {
  var self = this;
  var at = (this.state && this.state.at) || 6;
  function go(n) { return function () { self.setState({ at: Math.max(1, Math.min(11, n)) }); }; }
  var W = ['watching', 'transparent', -3], P = ['pleased', '#16A34A', -3], C = ['concerned', '#B26A00', 0], G = ['guarding', '#0070E0', null];
  var S = [
    ['Create', W, 'Family Circle is set up.', '$50 a turn. $300 to one person.', '', '', ''],
    ['Join', P, 'Everyone is in.', 'Six people signed and linked PayPal.', '6 of 6', 'linked', '91c0…4e2a'],
    ['Order', W, 'The order is agreed.', 'Set from everyone’s Circle Score.', '', '', ''],
    ['Collect', P, 'The pot is full.', 'All six paid on time.', '$306', 'collected', '5b7e…0c19'],
    ['Pay out', P, 'Amina got $300.', 'Sent with PayPal.', '$300', 'to Amina', 'c4d1…77fa'],
    ['Late payment', C, 'Musa’s payment failed.', 'Ngozi still gets paid in full.', '$51', 'failed', 'e8b5…5d12'],
    ['Protect', G, 'The pool covered Musa.', 'Ngozi got $300 on time.', '$300', 'to Ngozi', '7a20…31bf'],
    ['Swap turns', P, 'Tunde and Ifeoma swapped.', 'Ifeoma gets a $5 bonus.', '$5', 'to Ifeoma', '3fd2…9e41'],
    ['Recover', P, 'Musa paid it back.', 'The pool is full again.', '$50', 'refilled', '02fe…a6c4'],
    ['Complete', P, 'Every turn is paid.', 'Pebble now calls Amina a Pillar.', '$1,800', 'paid out', 'b9a3…e510'],
    ['Control tower', W, 'Two circles need cover.', 'They have less than two payouts in the pool.', '', '', '']
  ];
  var steps = S.map(function (s, i) {
    var n = i + 1, cur = n === at;
    return { n: n, name: s[0], go: go(n), current: cur ? 'step' : 'false', bar: cur ? '#18181B' : '#F4F4F5', fg: cur ? '#18181B' : n < at ? '#52525B' : '#A1A1AA', weight: cur ? '800' : '600' };
  });
  var s = S[at - 1], mood = s[1];
  var names = ['Amina', 'Musa', 'Ngozi', 'Tunde', 'Ifeoma', 'Sani'];
  var members = names.map(function (n) {
    var focus = (at === 6 || at === 9) && n === 'Musa' || at === 7 && n === 'Ngozi' || at === 8 && (n === 'Tunde' || n === 'Ifeoma') || (at === 5 || at === 10) && n === 'Amina';
    return { name: n, bg: focus ? '#18181B' : '#F4F4F5', fg: focus ? '#FFFFFF' : '#A1A1AA' };
  });
  return {
    steps: steps, members: members,
    cur: {
      head: s[2], sub: s[3], amount: s[4], what: s[5], hash: s[6], hasProof: !!s[4],
      moodName: mood[0], halo: mood[1], roundEyes: mood[2] !== null, flatEyes: mood[2] === null, eyeY: mood[2] === null ? 0 : mood[2],
      nextLabel: at === 11 ? 'Done' : 'Next: ' + S[at][0]
    },
    shortcuts: [
      { label: 'Fail Musa’s payment', go: go(6) },
      { label: 'Start Tunde’s swap', go: go(8) },
      { label: 'Musa pays back', go: go(9) }
    ],
    next: go(at === 11 ? 11 : at + 1), back: go(at - 1), reset: go(1)
  };
}
}
</script>
</body>
</html>
