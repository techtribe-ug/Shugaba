# Render Blueprint: one free web service running Next.js with the worker in-process (spec 4).
# Secrets are marked sync: false and set in the Render dashboard, never in git.
services:
  - type: web
    name: shugaba-demo
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:migrate && pnpm db:seed --if-empty && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_ALLOWED_HOSTS
        value: localhost,shugaba-demo.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://shugaba-demo.onrender.com
      - key: RUN_WORKER
        value: "true"
      - key: CLOCK_SPEED
        value: "1"
      - key: PAYMENT_PROVIDER
        value: paypal
      - key: COLLECTION_MODE
        value: vault
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL_AGENT
        value: gemini-3.6-flash
      - key: LLM_MODEL_FAST
        value: gemini-3.1-flash-lite
      - key: LLM_REPLAY
        value: "true"
      - key: WHATSAPP_MODE
        value: mock
      - key: DATABASE_URL
        fromDatabase:
          name: shugaba-db
          property: connectionString
      - key: KEY_ENC_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      # Sandbox test accounts (not secrets). Recipients are US sandbox accounts: PayPal cannot pay out to Nigerian accounts.
      - key: PAYPAL_PLATFORM_EMAIL
        value: sb-ukgiv53776854@business.example.com
      - key: SANDBOX_EMAIL_AMINA
        value: sb-tiejb53813842@personal.example.com
      - key: SANDBOX_EMAIL_MUSA
        value: sb-yieti53813864@personal.example.com
      - key: SANDBOX_EMAIL_NGOZI
        value: sb-dje7553813869@personal.example.com
      - key: SANDBOX_EMAIL_TUNDE
        value: sb-wqj44353813870@personal.example.com
      - key: SANDBOX_EMAIL_IFEOMA
        value: sb-pmbgk53813871@personal.example.com
      - key: SANDBOX_EMAIL_SANI
        value: sb-gonie53813876@personal.example.com
      - key: SANDBOX_DEMO_VAULT_ID
        sync: false
      - key: PAYPAL_CLIENT_ID
        value: AXITB8t7wc0npxkgntmk-1VyEcvTlJQ8j67vHksgmW0LAxNjJMN961pXmx9cuq46ghJSPe3KJVoL6BCE
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Webhook registered for https://shugaba-demo.onrender.com/api/webhooks/paypal (an id, not a secret).
      - key: PAYPAL_WEBHOOK_ID
        value: 9R39776592079010J
